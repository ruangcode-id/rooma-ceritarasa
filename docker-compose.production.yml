# Production stack: Postgres + Next.js + Caddy
# Usage (di VPS):
#   docker compose -f docker-compose.production.yml --env-file .env.production up -d --build
#
# IMPORTANT:
# - Jangan expose port Postgres ke publik
# - Simpan secret hanya di .env.production (chmod 600)

services:
  db:
    image: postgres:16
    container_name: rooma-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rooma_db}
      POSTGRES_USER: ${POSTGRES_USER:-rooma_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - rooma_pgdata:/var/lib/postgresql/data
    networks:
      - rooma_internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    container_name: rooma-app
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      # Credentials dipakai entrypoint untuk membangun DATABASE_URL
      # (password di-URL-encode — jangan interpolate mentah di sini).
      POSTGRES_USER: ${POSTGRES_USER:-rooma_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-rooma_db}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rooma_internal
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  caddy:
    image: caddy:2-alpine
    container_name: rooma-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # Wajib di .env.production (jangan default :-:80 — ambigu di Compose)
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS is required}
      GRAFANA_ADDRESS: ${GRAFANA_ADDRESS:?GRAFANA_ADDRESS is required}
      ACME_EMAIL: ${ACME_EMAIL:-admin@localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
      grafana:
        condition: service_started
    networks:
      - rooma_internal

  grafana:
    image: grafana/grafana:11.5.2
    container_name: rooma-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://${GRAFANA_ADDRESS:?GRAFANA_ADDRESS is required}
      GF_SERVER_DOMAIN: ${GRAFANA_ADDRESS:?GRAFANA_ADDRESS is required}
    volumes:
      - grafana_data:/var/lib/grafana
    # Jangan expose port ke host — akses hanya lewat Caddy
    networks:
      - rooma_internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

networks:
  rooma_internal:
    driver: bridge

volumes:
  rooma_pgdata:
  caddy_data:
  caddy_config:
  grafana_data:
